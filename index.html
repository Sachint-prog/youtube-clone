<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=Container, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .container{
            width: 100%;
            min-height: 100vh;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1em;
            padding: 10px;
            background-color: #f9f9f9;
        }
        .child{
            background-color: aqua;
            height: 200px;
        }
        .video_container{
            width: 250px;
            height: 300px;
            display: flex;
            gap: 0.5em;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .video{
            background-image: url("https://picsum.photos/250/150");
            background-size: contain;
            background-repeat: no-repeat;
            width: 250px;
            height: 150px;
            position: relative;
        }
        .video::after{
            position: absolute;
            content: attr(--data-time);
            bottom: 5px;
            right: 5px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 2px 5px;
            font-size: 0.9em;
        }
        .logo{
            background-image: url("https://picsum.photos/36/36");
            width: 36px;
            height: 36px;
        }
        .details{
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100px;
        }
        .data{
            width: 80%;
            justify-content: center;
            align-items: center;
        }
        .title{
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 5px;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel_name, .meta_data{
            color: rgba(0, 0, 0, 0.75);
        }
    </style>
</head>
<body>
    <div class="container">
        
    </div>

    <script>
        for (let i = 0; i < 100; i++) {
            let parent = document.querySelector(".container")
            let child = document.createElement("div")
            child.classList.add("video_container")
            child.innerHTML = `
                <div class="video" --data-time = "20:50"></div>
                <div class="details">
                    <div class="logo"></div>
                    <div class="data">
                        <div class="title">this is a title of the video that is showing above this title</div>
                        <div class="channel_name">channel_name</div>
                        <div class="meta_data">views and upload_time</div>
                    </div>
                </div>
            `
            parent.append(child)
        }
    </script>
</body>
</html>
