<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=Container, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            background-color: #f9f9f9;
        }
        header{
            width: 100%;
            height: 10vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        header nav{
            min-width: 50%;
            max-width: 90%;
            height: 100%;
        }
        header nav form {
            border: 2px solid black;
            border-radius: 50px;
            width: 100%;
            height: 100%;
            padding: 0px 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1em;
        }
        #search{
            width: 80%;
            height: 80%;
            border: none;
            /* border-radius: 50px; */
            border: none;
            outline: none;
            background-color: #f9f9f9;
        }
        #submit{
            border: none;
            outline: none;
            background-color: #f9f9f9;
            width: 10%;
        }
        #submit:hover{
            font-size: 1em;
            text-decoration: underline;
        }
        .container{
            width: 100%;
            min-height: 90vh;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1em;
            padding: 10px;
            background-color: #f9f9f9;
        }
        .child{
            background-color: aqua;
            height: 200px;
        }
        .video_container{
            width: 250px;
            height: 300px;
            display: flex;
            gap: 0.5em;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .video{
            background-image: url("https://picsum.photos/250/150");
            background-size: cover;
            background-repeat: no-repeat;
            width: 250px;
            height: 150px;
            position: relative;
        }
        .video::after{
            position: absolute;
            content: attr(--data-time);
            bottom: 5px;
            right: 5px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 2px 5px;
            font-size: 0.9em;
        }
        .logo{
            background-image: url("https://picsum.photos/36/36");
            width: 36px;
            height: 36px;
            border-radius: 50%;
        }
        .details{
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100px;
        }
        .data{
            width: 80%;
            justify-content: center;
            align-items: center;
        }
        .title{
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 5px;
            width: 100%;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .channel_name, .meta_data{
            color: rgba(0, 0, 0, 0.75);
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <form action="">
                <input id="search" type="text" placeholder="anime name">
                <input id="submit" type="submit" >
            </form>
        </nav>
    </header>

        function create_groupOf_videos(data) {
            for (let i = 0; i < data.length; i++) {   
                let title = data[i].attributes.canonicalTitle
                let thumbnail = data[i].attributes.coverImage.original
                let no_of_episodes = data[i].attributes.episodeCount
                let upload_time = data[i].attributes.startDate
                let id = data[i].id
                let video_link = data[i].attributes.youtubeVideoId

                createVideo(title, thumbnail, no_of_episodes, upload_time, id, video_link)
            }
        }
        
        function createVideo(title, thumbnail, no_of_episodes, upload_time, id, video_link) {
            for (let i = 0; i < 1; i++) {
                let parent = document.querySelector(".container")
                let child = document.createElement("div")
                child.classList.add("video_container")
                child.innerHTML = `
                    <a href="https://www.youtube.com/watch?v=${video_link}" target="_blank">
                        <div id="video${id}" class="video" --data-time = "20:50"></div>
                    </a>
                    <div class="details">
                        <div class="logo"></div>
                        <div class="data">
                            <div class="title">${title}</div>
                            <div class="channel_name">episodes: ${no_of_episodes}</div>
                            <div class="meta_data">views and ${upload_time}</div>
                        </div>
                    </div>
                `
                parent.append(child)
                url1 = `url(${thumbnail})`
                let video1 = document.getElementById(`video${id}`).style.backgroundImage = url1
                
            }
        }

    </script>
